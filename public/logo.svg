<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="colGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="colGradGreen" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)"/>

  <!-- Roof Blueprint Line -->
  <path d="M56 112 L128 56 L200 112" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Chart Columns (like a bar chart representing budget) -->
  <rect x="72" y="136" width="24" height="64" rx="4" fill="#ffffff" opacity="0.5"/>
  <rect x="116" y="112" width="24" height="88" rx="4" fill="#ffffff" opacity="0.8"/>
  <rect x="160" y="88" width="24" height="112" rx="4" fill="url(#colGradGreen)"/>

  <!-- Foundation Line -->
  <line x1="56" y1="200" x2="200" y2="200" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
</svg>
